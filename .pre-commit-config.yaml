# Local hooks: run the ruff version pinned in uv.lock through uv, offline.
# No hook repositories are downloaded, neither at install time nor at commit time.
# On a fresh clone, run `make install` first so that .venv exists.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint + safe fixes)
        entry: uv run --locked --offline ruff check --fix --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked --offline ruff format --force-exclude
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
